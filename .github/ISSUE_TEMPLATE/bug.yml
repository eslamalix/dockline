name: Bug report
description: Something in Dockline does not work as it should
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Click the Focus tile\n2. Press Start\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: A screenshot helps a lot.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Settings, System, About, Windows specifications.
      placeholder: "Windows 11 24H2"
  - type: input
    id: version
    attributes:
      label: Dockline version
      description: Dockline Settings, About.
